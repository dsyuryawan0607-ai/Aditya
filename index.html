<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closing Invasi 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            background-color: #f4f7f6;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { 
            color: #2c3e50; 
            margin-top: 0;
        }
        p { 
            line-height: 1.6; 
            color: #555; 
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #27ae60; 
        }
    </style>
</head>
<body>

    <h2>Congrats Aditya! 🎉</h2>
    <p>Udah menyelesaikan Invasi 2026. Sampai jumpa di LKMM TM 2026.</p>
    
    <p>Sampaikan kesan dan pesanmu selama closing Invasi kemarin pada kolom berikut ya...</p>
    
    <!-- Form sudah terhubung otomatis ke Formspree kamu -->
    <form action="https://formspree.io/f/mljjjgez" method="POST">
        
        <!-- Kolom nama -->
        <input type="text" name="nama" placeholder="Nama kamu (opsional)" required>
        
        <!-- Kolom kesan dan pesan -->
        <textarea name="kesan_pesan" placeholder="Tulis kesan dan pesanmu di sini..." required></textarea>
        
        <button type="submit">Kirim Pesan</button>
    </form>

</body>
</html>
